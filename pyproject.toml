[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wallpaper-changer"
version = "1.0.0"
description = "Rotate your desktop wallpapers automatically"
license = { text = "MIT" }
requires-python = ">=3.8"

[project.scripts]
wallpaper-changer = "wallpaper_changer.cli:main"

[tool.setuptools.packages.find]
include = ["wallpaper_changer*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
